name: Build Android APK

# Run it manually from the Actions tab, or automatically when you push a version
# tag like v1, v2, v1.3 (which also publishes a GitHub Release with the APK).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to publish the APK to Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Regenerates the (gitignored) Capacitor gradle files and copies www/ in.
      - name: Sync web assets into the Android project
        run: npx cap sync android

      # If signing secrets are configured, decode the keystore so release builds
      # are signed with a stable key (updates install over the old app, keeping
      # your data). Without secrets we fall back to a debug build.
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RPGIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          RPGIFY_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RPGIFY_KEYSTORE_PASSWORD: ${{ secrets.RPGIFY_KEYSTORE_PASSWORD }}
          RPGIFY_KEY_ALIAS: ${{ secrets.RPGIFY_KEY_ALIAS }}
          RPGIFY_KEY_PASSWORD: ${{ secrets.RPGIFY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Find the built APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | grep -v unsigned | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      # Give the APK a clear name so the Release asset is e.g.
      # rpgify-habits-2026-07-25.apk instead of app-debug.apk.
      - name: Rename APK
        id: named
        run: |
          DEST="rpgify-habits-$(date +%Y%m%d-%H%M).apk"
          cp "${{ steps.apk.outputs.path }}" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (zip, from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: rpgify-habits-apk
          path: ${{ steps.named.outputs.path }}

      # Always publish the APK to the Releases page as a direct, phone-tappable
      # file. Version tags (v1, v2, …) make a normal release; any other run
      # updates a rolling "latest-build" prerelease.
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.named.outputs.path }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
