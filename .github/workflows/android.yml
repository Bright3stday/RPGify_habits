name: Build Android APK

# Run it manually from the Actions tab (Run workflow), or by pushing a version
# tag. Every run publishes the signed APK to GitHub Pages at a stable URL:
#   https://<owner>.github.io/<repo>/apk/rpgify-latest.apk
# so you can install straight from your phone — no git tag or Release needed
# (this repo's rulesets restrict tag creation). Tag pushes additionally try to
# publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to push the APK to gh-pages / publish Releases

# Serialize with the web-OTA workflow so two jobs never race on gh-pages.
concurrency:
  group: rpgify-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git rev-list --count` is the real build number

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Bake the current web build number + OTA update channel into the APK, so
      # the installed app knows what it shipped with and where to look for
      # over-the-air web updates (see docs/INSTALL_AND_UPDATE.md).
      - name: Stamp OTA baseline
        run: node scripts/ota-stamp.mjs baseline
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Regenerates the (gitignored) Capacitor gradle files and copies www/ in.
      - name: Sync web assets into the Android project
        run: npx cap sync android

      # If signing secrets are configured, decode the keystore so release builds
      # are signed with a stable key (updates install over the old app, keeping
      # your data). Without secrets we fall back to a debug build.
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RPGIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          RPGIFY_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RPGIFY_KEYSTORE_PASSWORD: ${{ secrets.RPGIFY_KEYSTORE_PASSWORD }}
          RPGIFY_KEY_ALIAS: ${{ secrets.RPGIFY_KEY_ALIAS }}
          RPGIFY_KEY_PASSWORD: ${{ secrets.RPGIFY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Find the built APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | grep -v unsigned | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      # Give the APK a clear name so the Release asset is e.g.
      # rpgify-habits-2026-07-25.apk instead of app-debug.apk.
      - name: Rename APK
        id: named
        run: |
          DEST="rpgify-habits-$(date +%Y%m%d-%H%M).apk"
          cp "${{ steps.apk.outputs.path }}" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (zip, from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: rpgify-habits-apk
          path: ${{ steps.named.outputs.path }}

      # Publish the signed APK to GitHub Pages as a direct, phone-tappable file at
      # a STABLE url — no git tag, no Release, so repo tag-rulesets don't apply.
      # Lands at https://<owner>.github.io/<repo>/apk/rpgify-latest.apk (plus a
      # dated copy kept for history). Only real signed builds are published.
      - name: Stage APK for Pages
        if: steps.signing.outputs.signed == 'true'
        run: |
          mkdir -p apk-site/apk
          cp "${{ steps.named.outputs.path }}" "apk-site/apk/${{ steps.named.outputs.path }}"
          cp "${{ steps.named.outputs.path }}" "apk-site/apk/rpgify-latest.apk"
          # Publish a SHA-256 so anyone can verify their download (see docs/SECURITY.md).
          ( cd apk-site/apk && sha256sum rpgify-latest.apk > rpgify-latest.apk.sha256 )
          # Tiny index so the folder is browsable.
          {
            echo "<h1>RPGify Habits APKs</h1>"
            echo "<p>Latest: <a href=\"rpgify-latest.apk\">rpgify-latest.apk</a></p>"
          } > apk-site/apk/index.html
          # Root landing page (confirms Pages is live; links to the APK).
          {
            echo "<h1>RPGify Habits</h1>"
            echo "<p><a href=\"apk/rpgify-latest.apk\">Download latest APK</a></p>"
            echo "<p>OTA manifest: <a href=\"updates/latest.json\">updates/latest.json</a></p>"
          } > apk-site/index.html

      - name: Publish APK to GitHub Pages
        if: steps.signing.outputs.signed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-site
          destination_dir: .
          keep_files: true
          commit_message: "APK build ${{ steps.named.outputs.path }}"

      # Publish the APK to the Releases page as a direct, phone-tappable file.
      # Only on version tags (v1, v2, …): this repo has immutable releases
      # enabled, so a reused "latest-build" tag can't be re-uploaded to — each
      # tag must be unique. Branch/manual runs still produce the artifact above;
      # for a phone install, push a tag (see docs/INSTALL_AND_UPDATE.md).
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.named.outputs.path }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
